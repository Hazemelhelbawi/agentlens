name: Feature Request
description: Propose a capability for the Action, CLI, or analyzer
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should AgentLens behave?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - analyzer
        - crawler
        - scoring
        - github-action
        - cli
        - web
        - documentation
