    <title>Missing canonical example</title>
    <meta name="description" content="This page has metadata but no canonical URL." />

  </head>
  <body>
    <header><nav><a href="/about">About</a></nav></header>
    <main>

    </main>
    <footer>Footer</footer>
  </body>
</html>
