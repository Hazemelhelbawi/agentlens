<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multiple canonical fixture</title>
    <meta name="description" content="This page declares two canonical link tags." />
    <link rel="canonical" href="https://example.com/multiple-canonical" />
    <link rel="canonical" href="https://example.com/other" />
  </head>
  <body>
    <main>
      <h1>Multiple canonical tags</h1>
      <p>Both canonical tags are present in the document head.</p>
    </main>
  </body>
</html>
