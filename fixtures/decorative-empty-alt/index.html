<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decorative empty alt fixture</title>
    <meta name="description" content="An image with empty alt." />
  </head>
  <body>
    <main>
      <h1>Decorative image</h1>
      <img src="/divider.png" alt="" width="12" height="12" />
      <p>Empty alt is present and should not be treated as missing alt.</p>
    </main>
  </body>
</html>
